<!DOCTYPE html>
<head>
<title>DIGITAL CLOCK</title>

<style type="text/css">
    h1{
        font-size: 100px;
        font-family: verdana;
        text-align: center;
    }
    body{
       
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:Verdana;
    }

    .clock{
        background:#3a3a3a;
        padding:20px 30px;
        border-radius:8px;
        display:flex;
        align-items:center;
        gap:10px;
        box-shadow:0px 4px 10px rgba(0,0,0,0.5);
    }

    .box{
        background:#111;
        color:#fff;
        font-size:50px;
        padding:15px 20px;
        border-radius:5px;
        min-width:80px;
        text-align:center;
        box-shadow: inset 0px 0px 8px rgba(0,0,0,0.8);
    }

    .colon{
        font-size:50px;
        color:white;
        font-weight:bold;
    }

    .session{
        color:white;
        font-size:20px;
        margin-left:10px;
        align-self:flex-end;
    }

</style>
</head>
<body onload="showTime()">

    <div class="clock">
    <div class="box" id="hour">00</div>
    <div class="colon">:</div>
    <div class="box" id="minute">00</div>
    <div class="colon">:</div>
    <div class="box" id="second">00</div>
    <div class="session" id="ampm">AM</div>
</div>

</body>

<script type="text/javascript">
    function showTime(){
        var d = new Date();
        var h =d.getHours();
        var m =d.getMinutes();
        var s = d.getSeconds();

        // Set AM or PM using original hour value
        var session = (h >= 12) ? "PM" : "AM";


        // show 12 instead of 0 at midnight
        if (h == 0)
        {
        h = 12;
        }


        // Ternary operator is used to add a leading zero
        h = h < 10 ? "0" +h : h;
        m = m < 10 ? "0" +m : m;
        s = s < 10 ? "0" +s : s;
        
    document.getElementById("hour").innerText = h;
    document.getElementById("minute").innerText = m;
    document.getElementById("second").innerText = s;
    document.getElementById("ampm").innerText = session;

    setTimeout(showTime,1000);
    }


</script>
</html>
